name: CI - Nightly - Spring Boot DevSecOps

# Nightly + SCA profundo: ademas de todo el CI, ejecuta OWASP Dependency-Check (base NVD completa).
# Requiere el secret NVD_API_KEY (Settings > Secrets and variables > Actions).
# Los schedule solo corren desde la rama por defecto; para la evidencia usa "Run workflow" (workflow_dispatch).
on:
  schedule:
    - cron: '55 20 * * *'      # todos los dias a las 20:55 hora de La Paz
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly
    uses: ./.github/workflows/_ci-core.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    secrets: inherit           # pasa NVD_API_KEY al workflow reutilizable
    with:
      run-odc: true
