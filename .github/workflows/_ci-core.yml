name: CI Core (reutilizable)

# Pipeline de seguridad compartido. No se dispara solo: lo invocan
#   - ci-sec.yml          (CI: feature/**, bugfix/**, hotfix/** y PR a main/develop)
#   - ci-cd-sec.yml       (CI/CD: push a main y develop)
#   - ci-sec-nightly.yml  (nightly + SCA con Dependency-Check)
# Todas las acciones estan fijadas por SHA de commit (el numero de version va en el comentario);
# Dependabot (github-actions) propone las actualizaciones.

on:
  workflow_call:
    inputs:
      run-odc:
        description: Ejecutar OWASP Dependency-Check (lento; requiere el secret NVD_API_KEY)
        type: boolean
        default: false
    secrets:
      NVD_API_KEY:
        required: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Compilar, pruebas unitarias y cobertura (JaCoCo esta ligado al verify en el pom)
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build, pruebas y cobertura
        run: mvn -B clean verify

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------
  # 2. SAST - CodeQL (alertas en Security > Code scanning + SARIF para el gate)
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:java"
          output: sarif-results
          # Los PR de Dependabot reciben un token de solo lectura: no pueden subir a Code scanning
          upload: ${{ github.actor == 'dependabot[bot]' && 'never' || 'always' }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------
  # 3. SAST - Semgrep (reglas publicas + .semgrep.yml). Sin --error: decide el Quality Gate
  # ------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Instalar Semgrep (version fija)
        run: pipx install semgrep==1.179.0

      # --config auto exige --metrics=on (con off Semgrep aborta)
      - name: Ejecutar Semgrep
        run: |
          mkdir -p semgrep-out
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-out/semgrep-results.json \
            --sarif-output=semgrep-out/semgrep-results.sarif \
            src/main/java

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: semgrep-reports
          path: semgrep-out/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------
  # 4. Analisis estatico - SpotBugs + FindSecBugs (goal "spotbugs": genera reporte sin fallar por hallazgos)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ejecutar SpotBugs + FindSecBugs
        run: mvn -B clean compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: spotbugs-reports
          path: target/spotbugsXml.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------
  # 5. SCA ligero - SBOM CycloneDX + Trivy (documento de apoyo 02)
  # ------------------------------------------------------------------
  sca-sbom:
    name: SCA - SBOM + Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Generar SBOM CycloneDX
        run: |
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          test -s target/bom.json

      - name: Reporte SCA completo (JSON; no bloquea, decide el Quality Gate)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target:/work" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" sbom \
            --scanners vuln \
            --exit-code 0 \
            --format json \
            --output /work/sca-report.json \
            /work/bom.json

      - name: Tabla HIGH/CRITICAL para el log
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target:/work" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" sbom \
            --scanners vuln \
            --skip-db-update \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --output /work/sca-table.txt \
            /work/bom.json
          cat target/sca-table.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: sca-sbom
          path: |
            target/bom.json
            target/sca-report.json
            target/sca-table.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------
  # 6. SCA profundo - OWASP Dependency-Check (solo nightly / manual: descarga la base NVD)
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    if: ${{ inputs.run-odc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Comprobar el secret NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error title=Falta NVD_API_KEY::Pide tu clave gratis en https://nvd.nist.gov/developers/request-an-api-key y guardala en Settings > Secrets and variables > Actions > New repository secret con el nombre NVD_API_KEY."
            exit 1
          fi

      # Clave rodante: restaura la ultima base y guarda la actualizada al terminar
      - name: Cache de la base de datos NVD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: odc-data-${{ github.run_id }}
          restore-keys: |
            odc-data-

      # -Dodc.failBuildOnCVSS=11 = nunca fallar aqui: el reporte siempre se genera y decide el Quality Gate
      - name: Ejecutar Dependency-Check (HTML + JSON)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check -Dodc.failBuildOnCVSS=11

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # ------------------------------------------------------------------
  # 7. Imagen Docker: se construye y se arranca; el healthcheck debe quedar "healthy"
  # ------------------------------------------------------------------
  docker-smoke-test:
    name: Docker - Build & Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Construir la imagen
        run: docker build -t webapi:ci .

      - name: Arrancar el contenedor y esperar a que este healthy
        run: |
          docker run -d --name webapi -p 8080:8080 webapi:ci
          status="starting"
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' webapi)
            echo "intento $i: health=$status"
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health || true
          echo
          if [ "$status" != "healthy" ]; then
            echo "::error::El contenedor no llego a healthy (estado: $status)"
            docker logs --tail 100 webapi
            exit 1
          fi

      - name: Limpiar
        if: always()
        run: docker rm -f webapi || true

  # ------------------------------------------------------------------
  # 8. QUALITY GATE: lee los reportes y rechaza si hay hallazgos HIGH/CRITICAL
  #    o si algun job requerido fallo / no dejo su reporte
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs:
      - build-and-test
      - sast-codeql
      - sast-semgrep
      - static-analysis
      - sca-sbom
      - sca-dependency-check
      - docker-smoke-test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Descargar todos los reportes
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: reports

      - name: Evaluar reportes (HIGH y CRITICAL bloquean)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ODC_EXPECTED: ${{ inputs.run-odc }}
        run: python3 .github/scripts/quality_gate.py --reports reports --fail-on HIGH

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: quality-gate-summary
          path: quality-gate-summary.md
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
