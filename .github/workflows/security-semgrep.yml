name: Security - Semgrep (manual)

# Laboratorio 1. Desde el Laboratorio 3 Semgrep forma parte del pipeline principal
# (job "SAST - Semgrep" en _ci-core.yml, con Quality Gate), asi que este workflow queda
# solo para ejecucion manual ("Run workflow") y evita escaneos duplicados.
# (Se corrigio ademas el trigger anterior: 'feature/**' tenia una comilla mal cerrada y nunca coincidia.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST con Semgrep (manual)
    runs-on: ubuntu-24.04

    container:
      image: semgrep/semgrep

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Ejecutar Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Publicar reportes de Semgrep
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-reports-manual
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14
