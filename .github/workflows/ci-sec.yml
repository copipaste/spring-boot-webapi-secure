name: CI - Spring Boot DevSecOps

# CI: se ejecuta en cada push a ramas de trabajo y en cada pull request hacia main/develop.
# Los jobs viven en _ci-core.yml; el job "Quality Gate" es el check requerido para mergear.
on:
  push:
    branches: [ 'feature/**', 'bugfix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancela ejecuciones antiguas de la misma rama / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/_ci-core.yml
    permissions:
      contents: read
      security-events: write   # CodeQL sube el SARIF a Code scanning
      actions: read
    with:
      run-odc: false           # Dependency-Check es lento: corre en el nightly (SCA ligero con Trivy aqui)
