name: CI/CD - Spring Boot DevSecOps

# CI/CD: push a main y develop. Reutiliza el CI completo (incluye el Quality Gate); solo si el gate
# aprueba se construye, se escanea y se publica la imagen, y luego se despliega en EC2:
#   develop -> staging (puerto 8081)      main -> production (puerto 8080, con aprobacion manual)
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy:
        description: Desplegar en EC2 despues de publicar (desmarcalo para probar solo CI, escaneo y publicacion)
        type: boolean
        default: true

# Sin cancelar: un push nuevo no debe interrumpir un despliegue a medias
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ==================================================================
  # CI: build, SAST, SCA, imagen de prueba y Quality Gate
  # ==================================================================
  ci:
    name: CI
    uses: ./.github/workflows/_ci-core.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      run-odc: false

  # ==================================================================
  # CD 1: construir imagen -> escanear con Trivy -> publicar en GHCR
  # ==================================================================
  docker-build-scan-push:
    name: Docker Build → Scan → Push
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push a GHCR
      security-events: write   # SARIF de Trivy en Code scanning
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Primero se construye en local (load) para escanear ANTES de publicar
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy recibe UNA sola referencia (tags[0]); steps.meta.outputs.tags trae varias lineas
      # trivyignores: riesgos aceptados con caducidad (evidencias/sca/riesgos-aceptados.md), igual que en el CI
      - name: Trivy - reporte SARIF de la imagen (no bloquea)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          version: v0.74.0
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '0'

      - name: Subir resultados de Trivy a Code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Reporte JSON completo de la imagen que se va a publicar (evidencia y carga en DefectDojo)
      - name: Trivy - reporte JSON de la imagen publicada (trivy-report.json)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          version: v0.74.0
          format: json
          output: trivy-report.json
          scanners: vuln,secret
          trivyignores: .trivyignore.yaml
          exit-code: '0'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: trivy-image-release
          path: |
            trivy-report.json
            trivy-results.sarif
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Trivy - gate de la imagen (CRITICAL y HIGH bloquean)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          version: v0.74.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Publicar imagen en GHCR
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Como se obtiene la version construida: queda en el resumen de la ejecucion
      - name: Resumen de publicacion
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          {
            echo "## Imagen publicada en GHCR"
            echo
            echo "- Referencia inmutable: \`${image}@${DIGEST}\`"
            echo "- Etiquetas: $(echo "$TAGS" | sed 's/^[^:]*://' | paste -sd ' ' -)"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Para obtenerla en cualquier equipo: \`docker pull ${image}@${DIGEST}\`."
            echo "El job de despliegue usa exactamente esta referencia (por digest, no por etiqueta)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================================================================
  # CD 2: desplegar en EC2 por SSH con una llave de despliegue DEDICADA.
  # En el servidor esa llave solo puede ejecutar /usr/local/bin/deploy-webapi (command= + restrict),
  # que valida la imagen (solo este repo, por digest), el contenedor y el puerto.
  # Se omite hasta que definas la variable del repositorio EC2_HOST (ver README e INFORME-LAB3.md, seccion 8).
  # ==================================================================
  deploy:
    name: Deploy to EC2
    needs: docker-build-scan-push
    if: ${{ vars.EC2_HOST != '' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    # main -> production (con revisores requeridos); develop -> staging
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'deploy' }}
      DIGEST: ${{ needs.docker-build-scan-push.outputs.image-digest }}
      APP_PORT: ${{ github.ref_name == 'main' && '8080' || '8081' }}
      CONTAINER: ${{ github.ref_name == 'main' && 'webapi-prod' || 'webapi-staging' }}

    steps:
      # La llave privada vive solo en el secret EC2_SSH_KEY; la huella del servidor se fija con
      # la variable EC2_KNOWN_HOSTS (salida de: ssh-keyscan -t ed25519 <host>) para evitar MITM.
      - name: Preparar SSH (llave de despliegue + host key fijada)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo "::error::Falta el secret EC2_SSH_KEY"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::Falta la variable EC2_KNOWN_HOSTS"; exit 1; }
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Desplegar por SSH
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          echo "Imagen : $IMAGE"
          echo "Destino: $CONTAINER, puerto $APP_PORT, servidor $EC2_HOST"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "${EC2_USER}@${EC2_HOST}" "${IMAGE} ${CONTAINER} ${APP_PORT}"

      - name: Borrar la llave del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
