name: CI/CD - Spring Boot DevSecOps

# CI/CD: push a main y develop. Reutiliza el CI completo (incluye el Quality Gate); solo si el gate
# aprueba se construye, se escanea y se publica la imagen, y luego se despliega en EC2:
#   develop -> staging (puerto 8081)      main -> production (puerto 8080, con aprobacion manual)
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

# Sin cancelar: un push nuevo no debe interrumpir un despliegue a medias
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ==================================================================
  # CI: build, SAST, SCA, imagen de prueba y Quality Gate
  # ==================================================================
  ci:
    name: CI
    uses: ./.github/workflows/_ci-core.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      run-odc: false

  # ==================================================================
  # CD 1: construir imagen -> escanear con Trivy -> publicar en GHCR
  # ==================================================================
  docker-build-scan-push:
    name: Docker Build → Scan → Push
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push a GHCR
      security-events: write   # SARIF de Trivy en Code scanning
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Primero se construye en local (load) para escanear ANTES de publicar
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy recibe UNA sola referencia (tags[0]); steps.meta.outputs.tags trae varias lineas
      - name: Trivy - reporte SARIF de la imagen (no bloquea)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          version: v0.74.0
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Subir resultados de Trivy a Code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy - gate de la imagen (CRITICAL y HIGH bloquean)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          version: v0.74.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Publicar imagen en GHCR
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ==================================================================
  # CD 2: desplegar en EC2 por AWS Systems Manager (sin SSH, credenciales temporales por OIDC)
  # Se omite hasta que definas las variables del repositorio AWS_ROLE_ARN y EC2_INSTANCE_ID
  # (ver INFORME-LAB3.md, seccion 8).
  # ==================================================================
  deploy:
    name: Deploy to EC2
    needs: docker-build-scan-push
    if: ${{ vars.EC2_INSTANCE_ID != '' && vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    # main -> production (con revisores requeridos); develop -> staging
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      id-token: write          # token OIDC para asumir el rol de AWS
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DIGEST: ${{ needs.docker-build-scan-push.outputs.image-digest }}
      APP_PORT: ${{ github.ref_name == 'main' && '8080' || '8081' }}
      CONTAINER: ${{ github.ref_name == 'main' && 'webapi-prod' || 'webapi-staging' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Desplegar con SSM Run Command
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          echo "Imagen : $IMAGE"
          echo "Destino: $CONTAINER, puerto $APP_PORT, instancia $INSTANCE_ID"

          # El script remoto vive en deploy/remote-deploy.sh; las variables viajan en la primera linea
          PREFIX="export IMAGE='${IMAGE}' CONTAINER='${CONTAINER}' APP_PORT='${APP_PORT}'"
          jq -n --arg prefix "$PREFIX" --rawfile script deploy/remote-deploy.sh \
            '{commands: [$prefix, $script]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7} -> ${CONTAINER}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          # 'aws ssm wait' se rinde a los ~100 s; se espera hasta 7,5 min con un bucle propio
          STATUS="Pending"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "---------- salida del despliegue ----------"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2 || true
          echo "-------------------------------------------"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::El despliegue termino con estado $STATUS"
            exit 1
          fi
