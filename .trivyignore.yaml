# Riesgos aceptados para Trivy (imagen y SBOM). Es el mismo registro que dependency-check-suppressions.xml
# (OWASP Dependency-Check), pero en el formato de Trivy. El analisis por CVE esta en
# evidencias/sca/riesgos-aceptados.md.
#
# Condiciones (iguales a las de Dependency-Check):
#   * Solo estos 15 CVE de Spring Framework 6.2.19 y Spring Security 6.5.11: no existe correccion de codigo abierto
#     para las lineas 6.x (6.2.20 y 6.5.12 son solo para clientes con soporte comercial; las versiones abiertas son
#     Spring Framework 7.0.9 y Spring Security 7.0.7/7.1.1, es decir Spring Boot 4.x).
#   * La aplicacion no usa ninguna de las funciones afectadas (solo @RestController, sin vistas, WebFlux, RSocket,
#     SSE, SpEL con entrada de usuario, LDAP ni WebAuthn).
#   * Caducan el 2026-12-31: despues Trivy vuelve a reportarlos y el Quality Gate vuelve a bloquear.
#   * No se baja el umbral del gate (HIGH/CRITICAL siguen bloqueando); el resto de hallazgos no se ve afectado.
vulnerabilities:
  - id: CVE-2026-47884
    statement: "Aceptado hasta 2026-12-31. XsltView en Spring MVC: la app no tiene vistas ni XSLT, solo @RestController."
    expired_at: 2026-12-31
