# Perfil "prod": se activa con SPRING_PROFILES_ACTIVE=prod en el despliegue (deploy/remote-deploy.sh).
# Reduce la superficie de ataque de la app de laboratorio cuando corre en una instancia EC2.
# Sin este perfil (ejecucion local / pruebas) la app conserva su configuracion deliberadamente insegura.
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=never
server.error.include-message=never
server.error.include-stacktrace=never
